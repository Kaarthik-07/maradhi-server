# .github/workflows/ci.yml
# CI pipeline using Nix for reproducible builds.
# Every step runs inside the pinned Nix environment from flake.lock,
# so CI always matches what developers run locally.

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      # ── Install Nix ─────────────────────────────────────────────────────
      # DeterminateSystems installer enables flakes and nix-command by default
      - uses: DeterminateSystems/nix-installer-action@main

      # ── Magic Nix Cache ─────────────────────────────────────────────────
      # Caches Nix store paths in GitHub Actions cache.
      # First run takes ~3min to build the dev shell; subsequent runs: ~30s.
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - uses: actions/checkout@v4

      # ── Test ─────────────────────────────────────────────────────────────
      - name: Run tests
        run: nix develop .#ci --command make test

      # ── Lint ─────────────────────────────────────────────────────────────
      - name: Run linter
        run: nix develop .#ci --command make lint

      # ── Vuln scan ─────────────────────────────────────────────────────────
      - name: Vulnerability scan
        run: nix develop .#ci --command make vuln

  build:
    name: Build Binary
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/checkout@v4

      # ── Reproducible build ───────────────────────────────────────────────
      # `nix build` produces a binary in ./result/bin/api
      # The hash of the output is deterministic — same source = same binary.
      - name: Build
        run: nix build

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: maradhi-api
          path: result/bin/api

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: nix build .#docker

      - name: Load and tag image
        run: |
          docker load < result
          docker tag maradhi-api:0.1.0 ghcr.io/${{ github.repository_owner }}/maradhi-api:latest
          docker tag maradhi-api:0.1.0 ghcr.io/${{ github.repository_owner }}/maradhi-api:${{ github.sha }}

      # Uncomment to push to GitHub Container Registry:
      # - name: Push image
      #   run: |
      #     echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin
      #     docker push ghcr.io/${{ github.repository_owner }}/maradhi-api:latest
